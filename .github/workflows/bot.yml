name: bot

# T1 delivery spine: single combined workflow.
# - schedule: every ~15 min at OFF-PEAK minutes (7,22,37,52) — the crowd
#   default `*/15` (aligning :00/:15/:30/:45) sits on GitHub's high-load
#   slots where scheduled runs get dropped/delayed (observed live:
#   ~96 intended ticks -> only 2 actually ran in one day).
# - schedule re-registered 2026-11-10: a workflow-file touch flushes the
#   scheduler so the NEW cron minute list is picked up (4 ticks went
#   missing immediately after the first cron swap).
# - repository_dispatch (send-fact): forced send, wired now for ticket T7
#   (Telegram webhook -> Cloudflare Worker -> dispatch).
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  repository_dispatch:
    types: [send-fact]

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Decide and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Dispatch runs force the send (on-demand command pipeline, T7).
          FORCE_SEND: ${{ github.event_name == 'repository_dispatch' && 'true' || 'false' }}
          # T7: the /lagi webhook worker dispatches {trigger: "lagi"}; such a
          # run takes the on-demand path (same pipeline, cooldown/probability
          # bypassed, no getUpdates — with a webhook set polling would error).
          TRIGGER: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.trigger || '' }}
          # Send-probability per tick: 0.10 (was 0.02) — raised after the
          # cron-drop incident so a normal day still lands ~2-3 facts.
          # COOLDOWN_MINUTES (90, default in code) keeps it from spamming.
          PROBABILITY: "0.10"
          # Optional enrichments (T5/T6): missing secrets expand to empty →
          # the corresponding features silently turn off (never a red run).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python scripts/decide_and_send.py

      - name: Commit state back only when changed
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "T1: update delivery state/history [skip ci]"
            git push
          else
            echo "no data changes; nothing to commit"
          fi
