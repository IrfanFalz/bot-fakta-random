name: bot

# T1 delivery spine: single combined workflow.
# - schedule: every ~15 min at OFF-PEAK minutes (7,22,37,52) — the crowd
#   default `*/15` (aligning :00/:15/:30/:45) sits on GitHub's high-load
#   slots where scheduled runs get dropped/delayed (observed live:
#   ~96 intended ticks -> only 2 actually ran in one day).
# - schedule re-registered 2026-11-10: a workflow-file touch flushes the
#   scheduler so the NEW cron minute list is picked up (4 ticks went
#   missing immediately after the first cron swap).
# - repository_dispatch (send-fact): forced send, wired now for ticket T7
#   (Telegram webhook -> Cloudflare Worker -> dispatch).
on:
  schedule:
    # Dua keluarga menit saling bolong (±7-8 menit antar event antri).
    # GitHub documentedly DROPS queued schedule jobs under high load
    # (observed: 96 intended ticks -> 2 ran). Two offset families double
    # the odds that enough events survive a degraded day; the in-code
    # cooldown (90 min) keeps the extra ticks from spamming.
    - cron: "7,22,37,52 * * * *"
    - cron: "3,18,33,48 * * * *"
  repository_dispatch:
    types: [send-fact]

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Decide and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Only the explicit /lagi path forces a send. The external
          # cron-job.org timer (trigger "cron-timer") is a RELIABLE tick
          # generator, not a command — it MUST go through the normal
          # gates (cooldown + probability roll), otherwise every 15-min
          # tick would guarantee a message (observed: two sends ~7 min
          # apart on day one of the timer).
          FORCE_SEND: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.trigger != 'cron-timer' && 'true' || 'false' }}
          # T7: the /lagi webhook worker dispatches {trigger: "lagi"}; such a
          # run takes the on-demand path (same pipeline, cooldown/probability
          # bypassed, no getUpdates — with a webhook set polling would error).
          TRIGGER: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.trigger || '' }}
          # Send-probability per tick. Delivery is now driven by the reliable
          # cron-job.org timer (~96 ticks/day, no longer forced), so the
          # normal gates apply: 0.02 ≈ ~2 sends/day nominal; the 90-min
          # cooldown bounds the ceiling even on a lucky streak.
          PROBABILITY: "0.02"
          # Optional enrichments (T5/T6): missing secrets expand to empty →
          # the corresponding features silently turn off (never a red run).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python scripts/decide_and_send.py

      - name: Commit state back only when changed
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "T1: update delivery state/history [skip ci]"
            git push
          else
            echo "no data changes; nothing to commit"
          fi
